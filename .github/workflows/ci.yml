name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skill and evaluation tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Compile scripts
        run: python -m compileall -q scripts

      - name: Test paired evaluation scorer
        run: python scripts/score_eval.py --self-test

      - name: Test trigger evaluation scorer
        run: python scripts/score_trigger_eval.py --self-test

      - name: Validate repository assets
        run: python scripts/validate_repository.py
