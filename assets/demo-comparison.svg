    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="660" rx="18" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="658.5" rx="17.5" fill="none" stroke="#243041" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="36" y="26" width="222" height="28" rx="14" fill="#13263a" stroke="#285075" stroke-width="1"/>
  <text x="147" y="44" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#67e8f9" letter-spacing="0.5">VERIFY ENGINEERING WORK</text>

  <text x="274" y="46" class="sans" font-size="20" font-weight="700" fill="#f1f5f9">Stop AI agents from guessing APIs &amp; faking passes</text>

  <!-- Right header pills -->
  <rect x="876" y="26" width="88" height="28" rx="14" fill="#16202e" stroke="#2a394e" stroke-width="1"/>
  <text x="920" y="44" text-anchor="middle" class="mono" font-size="11" fill="#94a3b8">No guess</text>
  <rect x="974" y="26" width="90" height="28" rx="14" fill="#16202e" stroke="#2a394e" stroke-width="1"/>
  <text x="1019" y="44" text-anchor="middle" class="mono" font-size="11" fill="#94a3b8">Stop line</text>
  <rect x="1074" y="26" width="90" height="28" rx="14" fill="#132b24" stroke="#1e5645" stroke-width="1"/>
  <text x="1119" y="44" text-anchor="middle" class="mono" font-size="11" fill="#6ee7b7">Zero deps</text>

  <text x="36" y="76" class="sans" font-size="13.5" fill="#94a3b8">Walkthrough of fixtures/engineering-pilot-v1/api-version: migrating payment_adapter.py to bundled vendor_sdk.py v2.1.</text>

  <!-- ==================== LEFT CARD: BEFORE ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="36" y="96" width="548" height="516" rx="14" fill="#141b24" stroke="#293548" stroke-width="1.2"/>
    <rect x="36" y="96" width="548" height="4" rx="2" fill="url(#warnGrad)"/>
  </g>

  <rect x="56" y="116" width="76" height="24" rx="12" fill="#321b20" stroke="#7f2b33" stroke-width="1"/>
  <text x="94" y="132" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#fca5a5">BEFORE</text>
  <text x="144" y="133" class="sans" font-size="16" font-weight="700" fill="#e2e8f0">Guessing + Public-Test Tunnel Vision</text>

  <!-- Before: Code box -->
  <rect x="56" y="156" width="508" height="162" rx="10" fill="#0c1118" stroke="#222e3e" stroke-width="1"/>
  <circle cx="74" cy="172" r="4.5" fill="#f87171"/>
  <circle cx="90" cy="172" r="4.5" fill="#fbbf24"/>
  <circle cx="106" cy="172" r="4.5" fill="#34d399"/>
  <text x="124" y="176" class="mono" font-size="11" fill="#64748b">payment_adapter.py (rushed patch)</text>

  <text x="72" y="202" class="mono" font-size="12" fill="#94a3b8">def submit_payment(client, request):</text>
  <text x="92" y="222" class="mono" font-size="12" fill="#f87171">minor = int(float(request["amount"]) * 100)</text>
  <text x="92" y="242" class="mono" font-size="12" fill="#cbd5e1">return client.submit(</text>
  <text x="112" y="262" class="mono" font-size="12" fill="#cbd5e1">amount_minor=minor,</text>
  <text x="112" y="282" class="mono" font-size="12" fill="#cbd5e1">currency=request["currency"],</text>
  <text x="112" y="302" class="mono" font-size="12" fill="#fb923c">idempotency_key=str(uuid.uuid4()))</text>

  <!-- Before: Public test passes -->
  <rect x="56" y="332" width="508" height="88" rx="10" fill="#101822" stroke="#223142" stroke-width="1"/>
  <text x="72" y="355" class="mono" font-size="11.5" font-weight="700" fill="#94a3b8">AGENT CLAIMS COMPLETION</text>
  <text x="72" y="378" class="mono" font-size="12" fill="#6ee7b7">PASS  test_submits_minor_units ("12.34" -&gt; 1234)</text>
  <text x="72" y="402" class="sans" font-size="13" fill="#e2e8f0">"Updated to SDK v2.1. All unit tests pass — ready to ship!"</text>

  <!-- Before: Hidden failure -->
  <rect x="56" y="434" width="508" height="158" rx="10" fill="#231216" stroke="#6c232d" stroke-width="1.2"/>
  <text x="72" y="458" class="mono" font-size="11.5" font-weight="700" fill="#fca5a5">WHAT BREAKS IN PRODUCTION / HELD-OUT TESTS</text>
  <text x="72" y="484" class="mono" font-size="12" fill="#fecaca">FAIL  float("0.29") * 100 == 28.999999999999996</text>
  <text x="112" y="504" class="mono" font-size="12" fill="#f87171">int(...) silently truncates 29 cents -&gt; 28 cents</text>
  <text x="72" y="530" class="mono" font-size="12" fill="#fecaca">FAIL  retry generates a fresh uuid4() per attempt</text>
  <text x="112" y="550" class="mono" font-size="12" fill="#fb923c">violates docs/SDK.md idempotency -&gt; double charge</text>
  <text x="72" y="576" class="sans" font-size="12" fill="#94a3b8">Root cause: skipped contract check, trusted 1 happy-path test, self-graded.</text>

  <!-- ==================== RIGHT CARD: AFTER ==================== -->
  <g filter="url(#cardShadow)">
    <rect x="616" y="96" width="548" height="516" rx="14" fill="#141b24" stroke="#293548" stroke-width="1.2"/>
    <rect x="616" y="96" width="548" height="4" rx="2" fill="url(#okGrad)"/>
  </g>

  <rect x="636" y="116" width="76" height="24" rx="12" fill="#123029" stroke="#1e6b54" stroke-width="1"/>
  <text x="674" y="132" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#6ee7b7">AFTER</text>
  <text x="724" y="133" class="sans" font-size="16" font-weight="700" fill="#e2e8f0">Verify Engineering Work Workflow</text>

  <!-- After: Step 1 Evidence -->
  <rect x="636" y="156" width="508" height="96" rx="10" fill="#0c1118" stroke="#1f3a4d" stroke-width="1"/>
  <text x="652" y="178" class="mono" font-size="11.5" font-weight="700" fill="#38bdf8">1. DIRECT EVIDENCE FIRST (NEVER GUESS)</text>
  <text x="652" y="200" class="mono" font-size="11.5" fill="#cbd5e1">vendor_sdk.py:8  submit(*, amount_minor, currency,</text>
  <text x="772" y="218" class="mono" font-size="11.5" fill="#cbd5e1">idempotency_key)</text>
  <text x="652" y="238" class="mono" font-size="11.5" fill="#67e8f9">docs/SDK.md:4    integer minor units; reuse key on retry</text>

  <!-- After: Step 2 Exact edit -->
  <rect x="636" y="264" width="508" height="114" rx="10" fill="#0c1118" stroke="#1e4d40" stroke-width="1"/>
  <text x="652" y="286" class="mono" font-size="11.5" font-weight="700" fill="#34d399">2. EXACT CONTRACT + MINIMAL PATCH</text>
  <text x="652" y="308" class="mono" font-size="11.5" fill="#6ee7b7">amount_minor = int((Decimal(str(amt)) * 100)</text>
  <text x="772" y="326" class="mono" font-size="11.5" fill="#6ee7b7">.to_integral_exact())</text>
  <text x="652" y="346" class="mono" font-size="11.5" fill="#cbd5e1">idempotency_key = request["request_id"]  # stable retry</text>
  <text x="652" y="366" class="sans" font-size="12" fill="#94a3b8">Eliminates float rounding drift; preserves request_id contract.</text>

  <!-- After: Step 3 Validation -->
  <rect x="636" y="390" width="508" height="94" rx="10" fill="#0c1118" stroke="#223142" stroke-width="1"/>
  <text x="652" y="412" class="mono" font-size="11.5" font-weight="700" fill="#a78bfa">3. INDEPENDENT CHECKS + SEMANTIC DIFF REVIEW</text>
  <text x="652" y="434" class="mono" font-size="11.5" fill="#6ee7b7">PASS  unittest discover -s tests -v (existing + boundary)</text>
  <text x="652" y="454" class="mono" font-size="11.5" fill="#6ee7b7">PASS  Decimal("0.29") -&gt; 29; duplicate call reuses key</text>
  <text x="652" y="472" class="sans" font-size="12" fill="#94a3b8">No self-grading; stops on hard stop line if axis change stalls.</text>

  <!-- After: Step 4 Honest report -->
  <rect x="636" y="496" width="508" height="96" rx="10" fill="#101f1b" stroke="#1e5645" stroke-width="1.2"/>
  <text x="652" y="518" class="mono" font-size="11.5" font-weight="700" fill="#6ee7b7">4. HONEST 4-PART REPORT</text>
  <text x="652" y="540" class="mono" font-size="11.5" fill="#e2e8f0">Verified:    vendor_sdk.py:8, unittest (2 passed, 0 fail)</text>
  <text x="652" y="558" class="mono" font-size="11.5" fill="#cbd5e1">Assumed:     2-decimal minor units for USD/CNY only</text>
  <text x="652" y="576" class="mono" font-size="11.5" fill="#94a3b8">Unverified:  live gateway integration (not in workspace)</text>

  <!-- Footer -->
  <text x="600" y="640" text-anchor="middle" class="sans" font-size="12" fill="#64748b">Illustrative walkthrough of fixtures/engineering-pilot-v1/api-version (not a multi-task benchmark claim). Works with Claude Code · Codex · Cursor · Gemini CLI.</text>
